name: Main

on:
  push:
    branches:
      - main

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  checks: write
  statuses: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-libs:
    name: Build libraries - Main
    runs-on: macos-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Build
        run: ./gradlew :ui-core:build :ui-tiles:build :ui-tiles-extended:build :ui-tiles-expressive:build --max-workers 2

  build-sample:
    name: Build sample ${{ matrix.config.target }} - Main
    strategy:
      matrix:
        config: [
          { target: android, module: androidApp, os: ubuntu-24.04, tasks: assembleDebug },
          { target: iOS, module: iosApp, os: macos-latest, tasks: compileKotlinIosArm64 },
          { target: js, module: webApp, os: ubuntu-24.04, tasks: jsBrowserDistribution },
          { target: wasm, module: webApp, os: ubuntu-24.04, tasks: wasmJsBrowserDistribution },
          { target: desktop, module: desktopApp, os: ubuntu-24.04, tasks: assemble }
        ]
    runs-on: ${{ matrix.config.os }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Build sample
        run: ./gradlew :samples:${{ matrix.config.module }}:${{ matrix.config.tasks }}

  publish-check:
    name: Check publication - Main
    runs-on: macos-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Sign and publish to MavenLocal
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSWORD }}
        run: ./gradlew publishToMavenLocal

  # Deployment job
  deploy:
    name: Deploy to Github pages
    if: ${{ success() }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: [ build-libs, build-sample, publish-check ]
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Build sample JS - Main
        run: ./gradlew :samples:webApp:wasmJsBrowserDistribution

      - name: Copy webApp to dist
        run: cp -r samples/webApp/build/dist/wasmJs/productionExecutable deployment/

      - name: Build dokka - Main
        run: ./gradlew dokkaGeneratePublicationHtml

      - name: Copy dokka html to dist
        run: cp -r docs/html deployment/dokka

      - name: Upload your page as github pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: deployment/
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
