name: Pull request

on:
  pull_request:
    branches:
      - main

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  checks: write
  statuses: write
  id-token: write
  pull-requests: write
  repository-projects: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-libs:
    name: Build libraries - PR
    runs-on: macos-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Build
        run: ./gradlew :ui-core:build :ui-tiles:build :ui-tiles-extended:build :ui-tiles-expressive:build --max-workers 2

  build-sample:
    name: Build sample ${{ matrix.config.target }} - PR
    strategy:
      matrix:
        config: [
          { target: android, module: androidApp, os: ubuntu-24.04, tasks: assembleDebug },
          { target: iOS, module: iosApp, os: macos-latest, tasks: compileKotlinIosArm64 },
          { target: js, module: webApp, os: ubuntu-24.04, tasks: jsBrowserDistribution },
          { target: wasm, module: webApp, os: ubuntu-24.04, tasks: wasmJsBrowserDistribution },
          { target: desktop, module: desktopApp, os: ubuntu-24.04, tasks: assemble }
        ]
    runs-on: ${{ matrix.config.os }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Build sample
        run: ./gradlew :samples:${{ matrix.config.module }}:${{ matrix.config.tasks }}

  publish-check:
    name: Check publication - PR
    runs-on: macos-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Sign and publish to MavenLocal
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSWORD }}
        run: ./gradlew publishToMavenLocal
